name: release

# Publishing goes through npm's Trusted Publishing (OIDC) with a stage-only
# configuration: the runner asks GitHub for a short-lived identity token, npm
# exchanges it, and the tarball is put in the stage queue instead of going live.
# A maintainer then approves it on npmjs.com with their own 2FA. No secret is
# stored anywhere and CI never needs a 2FA code.
#
# Stage-only is deliberate: `npm publish` from this workflow is rejected, and the
# only thing a compromised tag push could do is leave a staged version that still
# needs a human approval.
#
# One-time setup on npmjs.com: package Settings -> Trusted Publishing has a GitHub
# Actions publisher for this repository, this workflow filename, and ONLY the
# "npm stage publish" permission.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `npm stage` needs npm >= 11.15.0; the bundled version moves with Node, so
      # pin the floor instead of trusting whichever one ships with the runner.
      - name: Ensure npm supports staged publishing
        run: npm install --global npm@^11.15.0

      - name: Show the toolchain
        run: node --version && npm --version

      # A tag that disagrees with package.json would stage the wrong version.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # Both self-checks. prepublishOnly may or may not fire for a staged publish,
      # so run them explicitly: a failing check must stop the stage.
      - name: Self-check
        run: npm run check

      - name: Stage the release
        run: npm stage publish --provenance --access public
