name: release

# Publishing goes through npm's Trusted Publishing (OIDC), not through a token:
# the runner asks GitHub for a short-lived identity token, npm exchanges it, and
# the package is published with provenance. No secret is stored anywhere, and no
# 2FA code is needed — a token with "bypass 2FA" would be the alternative, and npm
# is retiring those.
#
# One-time setup on npmjs.com: the package's Settings -> Trusted Publishing gets a
# GitHub Actions publisher for this repository and this workflow filename.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show the toolchain
        run: node --version && npm --version

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # prepublishOnly runs scripts/smoke.mjs and scripts/client-check.mjs, so a
      # failing self-check stops the upload before anything reaches the registry.
      - name: Publish
        run: npm publish --provenance --access public
